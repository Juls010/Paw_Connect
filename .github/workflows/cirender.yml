name: run tests and deploy

on:
  push:
    branches: [main]

jobs: 
  build-and-deploy: 
    runs-on: ubuntu-latest
    services: 
      mongodb: 
        image: mongo:latest
        ports: 
          - 27017:27017
    steps: 
      - name: Clonar código
        uses: actions/checkout@v4
      - name: Instalar node
        uses: actions/setup-node@v4
        with: 
          node-version: '22'  
      - name: Instalar dependencias
        run: npm install
      - name: Correr test
        run: npm test
        env: 
          MONGO_URL: ruta

